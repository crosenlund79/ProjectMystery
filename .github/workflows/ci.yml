name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  python:
    name: Python laboratory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and acceptance tests (includes the real .cmd launchers on Windows)
        run: python -m unittest discover -s tests -t . -v
      - name: Validate the bundled case library
        shell: bash
        run: python -m mystery validate-case godot/cases/*.mcase
      - name: The bundled library regenerates identically from its seeds
        if: runner.os == 'Linux'
        run: python -m mystery build-library --check

  godot:
    name: Godot game - tests, Windows export, smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_RELEASE }}-win64-v2

      - name: Install Godot ${{ env.GODOT_RELEASE }} and the Windows export templates
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dl = Join-Path $HOME "godot-dl"
          New-Item -ItemType Directory -Force $dl | Out-Null
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_RELEASE"
          $zip = Join-Path $dl "godot.zip"
          if (-not (Test-Path $zip)) { curl.exe -sSL --fail -o $zip "$base/Godot_v$($env:GODOT_RELEASE)_win64.exe.zip" }
          # The template bundle holds every platform (about 1 GB); keep only the Windows templates in the cache.
          $wintpl = Join-Path $dl "windows-templates"
          if (-not (Test-Path (Join-Path $wintpl "windows_release_x86_64.exe"))) {
            $tpz = Join-Path $env:RUNNER_TEMP "templates.tpz"
            curl.exe -sSL --fail -o $tpz "$base/Godot_v$($env:GODOT_RELEASE)_export_templates.tpz"
            New-Item -ItemType Directory -Force $wintpl | Out-Null
            7z e $tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" "-o$wintpl" -y | Out-Null
            Remove-Item $tpz
          }
          $bin = Join-Path $env:RUNNER_TEMP "godot"
          Expand-Archive $zip -DestinationPath $bin -Force
          $console = Get-ChildItem $bin -Filter "*_console.exe" -Recurse | Select-Object -First 1
          if (-not $console) { throw "Godot console binary not found" }
          "GODOT=$($console.FullName -replace '\\', '/')" >> $env:GITHUB_ENV
          $tpl = Join-Path $env:APPDATA "Godot\export_templates\$($env:GODOT_VERSION).stable"
          New-Item -ItemType Directory -Force $tpl | Out-Null
          Copy-Item (Join-Path $wintpl "*") $tpl -Force
          Get-ChildItem $tpl | Format-Table Name, Length
          & $console.FullName --version

      - name: Import the project
        shell: bash
        run: |
          "$GODOT" --headless --path godot --editor --quit-after 1500 > import.log 2>&1 || true
          n=$(ls godot/.godot/imported/*.ctex 2>/dev/null | wc -l)
          if [ "$n" -lt 470 ]; then "$GODOT" --headless --path godot --editor --quit-after 8000 >> import.log 2>&1 || true; fi
          echo "imported textures: $(ls godot/.godot/imported/*.ctex 2>/dev/null | wc -l)"
          tail -n 20 import.log

      - name: Godot tests (case loading, rules, saves, Python parity, end-to-end UI)
        shell: bash
        run: |
          set +e
          "$GODOT" --headless --path godot -s res://tests/run_tests.gd > godot-tests.log 2>&1
          code=$?
          set -e
          cat godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" godot-tests.log; then
            echo "::error::GDScript errors in the test run"; exit 1
          fi
          if [ "$code" != "0" ] || ! grep -q "ALL GODOT TESTS PASSED" godot-tests.log; then
            echo "::error::Godot tests failed (exit $code)"; exit 1
          fi

      - name: Export the Windows build
        shell: bash
        run: |
          mkdir -p build/ProjectMystery
          "$GODOT" --headless --path godot --export-release "Windows Desktop" ../build/ProjectMystery/ProjectMystery.exe > export.log 2>&1 || true
          cat export.log
          test -f build/ProjectMystery/ProjectMystery.exe
          cp godot/WINDOWS-README.txt build/ProjectMystery/README.txt
          ls -la build/ProjectMystery

      - name: Smoke-test the exported executable (no Python, no editor)
        shell: bash
        run: |
          report="$(cygpath -w "$PWD/smoke.txt")"
          set +e
          ./build/ProjectMystery/ProjectMystery.exe --headless -- "--smoke-test=$report"
          code=$?
          set -e
          cat smoke.txt
          [ "$code" = "0" ] && grep -q "SMOKE OK" smoke.txt

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMystery-windows
          path: build/ProjectMystery/
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            import.log
            godot-tests.log
            export.log
            smoke.txt
          if-no-files-found: ignore

  screens:
    name: Godot game - screenshots and web build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the web export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_RELEASE }}-linux-web-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }}, the web templates and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          dl="$HOME/godot-dl"; mkdir -p "$dl"
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          [ -f "$dl/godot.zip" ] || curl -sSL --fail -o "$dl/godot.zip" "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          if [ ! -f "$dl/web/web_nothreads_release.zip" ]; then
            curl -sSL --fail -o "$RUNNER_TEMP/t.tpz" "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            mkdir -p "$dl/web"
            unzip -j -q "$RUNNER_TEMP/t.tpz" "templates/web_nothreads_release.zip" "templates/web_nothreads_debug.zip" "templates/version.txt" -d "$dl/web"
            rm "$RUNNER_TEMP/t.tpz"
          fi
          unzip -q -o "$dl/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl" && cp "$dl"/web/* "$tpl"/

      - name: Import the project
        run: |
          "$GODOT" --headless --path godot --editor --quit-after 1500 > import.log 2>&1 || true
          n=$(ls godot/.godot/imported/*.ctex 2>/dev/null | wc -l)
          if [ "$n" -lt 470 ]; then "$GODOT" --headless --path godot --editor --quit-after 8000 >> import.log 2>&1 || true; fi
          echo "imported textures: $(ls godot/.godot/imported/*.ctex 2>/dev/null | wc -l)"
          tail -n 5 import.log

      - name: Run the game and take screenshots (software OpenGL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p shots
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          sleep 2
          set +e
          DISPLAY=:99 timeout -k 10 260 "$GODOT" --path godot --display-driver x11 --rendering-driver opengl3 \
            --resolution 1280x800 -s res://tests/screenshots.gd -- --out="$PWD/shots" > shots.log 2>&1
          echo "exit: $?"
          set -e
          head -c 6000 shots.log
          ls -la shots
          test "$(ls shots/*.png | wc -l)" -ge 10

      - name: Export the web build
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path godot --export-release "Web" ../build/web/index.html > web-export.log 2>&1 || true
          tail -n 20 web-export.log
          ls -la build/web
          test -f build/web/index.html && test -f build/web/index.pck

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMystery-web
          path: build/web/
          if-no-files-found: error

