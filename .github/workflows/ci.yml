name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  python:
    name: Python laboratory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and acceptance tests (includes the real .cmd launchers on Windows)
        run: python -m unittest discover -s tests -t . -v
      - name: Validate the bundled case library
        shell: bash
        run: python -m mystery validate-case godot/cases/*.mcase
      - name: The bundled library regenerates identically from its seeds
        if: runner.os == 'Linux'
        run: python -m mystery build-library --check

  godot:
    name: Godot game - tests, Windows export, smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_RELEASE }}-win64-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }} and the Windows export templates
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dl = Join-Path $HOME "godot-dl"
          New-Item -ItemType Directory -Force $dl | Out-Null
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_RELEASE"
          $zip = Join-Path $dl "godot.zip"
          $tpz = Join-Path $dl "templates.tpz"
          if (-not (Test-Path $zip)) { curl.exe -sSL --fail -o $zip "$base/Godot_v$($env:GODOT_RELEASE)_win64.exe.zip" }
          if (-not (Test-Path $tpz)) { curl.exe -sSL --fail -o $tpz "$base/Godot_v$($env:GODOT_RELEASE)_export_templates.tpz" }
          $bin = Join-Path $env:RUNNER_TEMP "godot"
          Expand-Archive $zip -DestinationPath $bin -Force
          $console = Get-ChildItem $bin -Filter "*_console.exe" -Recurse | Select-Object -First 1
          if (-not $console) { throw "Godot console binary not found" }
          "GODOT=$($console.FullName -replace '\\', '/')" >> $env:GITHUB_ENV
          $tpl = Join-Path $env:APPDATA "Godot\export_templates\$($env:GODOT_VERSION).stable"
          New-Item -ItemType Directory -Force $tpl | Out-Null
          7z e $tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" "-o$tpl" -y | Out-Null
          Get-ChildItem $tpl | Format-Table Name, Length
          & $console.FullName --version

      - name: Import the project
        shell: bash
        run: |
          "$GODOT" --headless --path godot --editor --quit-after 600 > import.log 2>&1 || true
          tail -n 20 import.log

      - name: Godot tests (case loading, rules, saves, Python parity, end-to-end UI)
        shell: bash
        run: |
          set +e
          "$GODOT" --headless --path godot -s res://tests/run_tests.gd > godot-tests.log 2>&1
          code=$?
          set -e
          cat godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" godot-tests.log; then
            echo "::error::GDScript errors in the test run"; exit 1
          fi
          if [ "$code" != "0" ] || ! grep -q "ALL GODOT TESTS PASSED" godot-tests.log; then
            echo "::error::Godot tests failed (exit $code)"; exit 1
          fi

      - name: Export the Windows build
        shell: bash
        run: |
          mkdir -p build/ProjectMystery
          "$GODOT" --headless --path godot --export-release "Windows Desktop" ../build/ProjectMystery/ProjectMystery.exe > export.log 2>&1 || true
          cat export.log
          test -f build/ProjectMystery/ProjectMystery.exe
          cp godot/WINDOWS-README.txt build/ProjectMystery/README.txt
          ls -la build/ProjectMystery

      - name: Smoke-test the exported executable (no Python, no editor)
        shell: bash
        run: |
          report="$(cygpath -w "$PWD/smoke.txt")"
          set +e
          ./build/ProjectMystery/ProjectMystery.exe --headless -- "--smoke-test=$report"
          code=$?
          set -e
          cat smoke.txt
          [ "$code" = "0" ] && grep -q "SMOKE OK" smoke.txt

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMystery-windows
          path: build/ProjectMystery/
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            import.log
            godot-tests.log
            export.log
            smoke.txt
          if-no-files-found: ignore
